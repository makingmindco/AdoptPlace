ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/adoptplace/public
    DirectoryIndex index.php
    # Preserve API errors and never replace them with the React entry point.
    ErrorDocument 404 default

    <Directory /var/www/adoptplace/public>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Only the Laravel front controller is executable as PHP.
    <FilesMatch "^(?!index\.php$).*\.(?i:php|phtml|phar)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
