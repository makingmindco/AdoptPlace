expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
upload_max_filesize = 5M
post_max_size = 8M
memory_limit = 128M
; Debian ca-certificates package. Never copy the corporate Windows CA bundle.
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
